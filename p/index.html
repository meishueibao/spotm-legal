<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotM 應援地圖</title>
  <meta name="description" content="點開看應援物、時間地點與剩餘數量">
  <meta name="robots" content="noindex">

  <!-- 連結預覽（Threads / X / LINE / FB）：爬蟲不會執行 JS，所以每個 pin 都是同一張卡片 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SpotM">
  <meta property="og:title" content="SpotM 應援地圖">
  <meta property="og:description" content="點開看應援物、時間地點與剩餘數量">
  <meta property="og:image" content="https://meishueibao.github.io/spotm-legal/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SpotM 應援地圖">
  <meta name="twitter:description" content="點開看應援物、時間地點與剩餘數量">
  <meta name="twitter:image" content="https://meishueibao.github.io/spotm-legal/og.png">

  <link rel="stylesheet" href="../style.css">
  <style>
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
    }
    .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .badge {
      display: inline-block; font-size: 13px; font-weight: 700;
      padding: 2px 10px; border-radius: 999px; background: var(--note-bg); color: var(--accent);
    }
    .badge.gray { background: var(--line); color: var(--muted); }
    .updated { font-size: 13px; color: var(--muted); }
    .group { font-size: 26px; font-weight: 800; line-height: 1.3; margin: 0 0 4px; word-break: break-word; }
    .publisher { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip {
      border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
      font-size: 15px; font-weight: 600;
    }
    .chip .qty { margin-left: 6px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .cell { background: var(--bg); border-radius: 14px; padding: 12px; min-width: 0; }
    .cell .label { font-size: 13px; color: var(--muted); }
    .cell .value { font-size: 20px; font-weight: 800; line-height: 1.3; word-break: break-word; }
    .cell .sub { font-size: 13px; color: var(--muted); }
    .row { margin: 0 0 12px; }
    .row .label { font-size: 13px; color: var(--muted); }
    .row .value { font-size: 16px; white-space: pre-wrap; word-break: break-word; }
    .notice {
      background: #fef2f2; color: #b91c1c; border-radius: 12px;
      padding: 10px 12px; font-size: 14px; margin-bottom: 16px;
    }
    .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .btn {
      display: block; text-align: center; text-decoration: none; font-weight: 700;
      font-size: 16px; padding: 14px; border-radius: 14px;
    }
    .btn.primary { background: #3b82f6; color: #fff; }
    .btn.secondary { background: var(--card); color: var(--accent); border: 1px solid var(--line); }
    .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 0; }
    .state { text-align: center; padding: 40px 20px; }
    .state h2 { font-size: 20px; margin-bottom: 8px; }
    .state p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">SpotM</div>
      <p class="meta">追星應援物地圖</p>
    </header>

    <div id="app" class="card state"><p>讀取中…</p></div>
    <noscript><div class="card state"><p>請開啟 JavaScript 才能查看應援資訊。</p></div></noscript>

    <footer><a href="../">關於 SpotM</a> · © 2026 SpotM</footer>
  </main>

  <script>
    // Supabase 公開金鑰（跟 App 裡的同一把，本來就是公開的；權限由 RLS 控制：
    // 訪客只讀得到還沒結束、沒過期、沒被隱藏的 pin）
    const SUPABASE_URL = 'https://ndzhixqyzdbvgkfvigjy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kemhpeHF5emRidmdrZnZpZ2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODk5MzMsImV4cCI6MjEwNzQ2NTkzM30.YS7rr27dOaxiiTtcbjL32Wu8M-oGOk9WZr2iHJVJx6I';
    const HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };
    const TYPE_LABEL = { giveaway: '現場應援', trade: '面交換卡' };
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    const app = document.getElementById('app');

    // ---------- 小工具（規則跟 App 的 utils/pinTime、pinDisplay 一樣） ----------

    // 台灣時間（UTC+8）的日期：回傳 YYYYMMDD 數字方便比大小
    const TAIPEI_OFFSET_MS = 8 * 3600 * 1000;
    const taipeiDayNum = (time) => {
      const t = new Date(time + TAIPEI_OFFSET_MS);
      return t.getUTCFullYear() * 10000 + (t.getUTCMonth() + 1) * 100 + t.getUTCDate();
    };
    const pinDayNum = (estimatedTime) => {
      const m = (estimatedTime || '').match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})/);
      return m ? Number(m[1]) * 10000 + Number(m[2]) * 100 + Number(m[3]) : null;
    };
    const toQty = (q) => Math.max(0, parseInt(q || '0', 10) || 0);
    const qtyColor = (n) => (n === 0 ? '#94A3B8' : n >= 30 ? '#10B981' : n >= 11 ? '#F59E0B' : '#EF4444');

    function splitTime(value) {
      if (!value) return { date: null, range: '未填寫' };
      const m = value.trim().match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})\s*(.*)$/);
      if (!m) return { date: null, range: value };
      return { date: Number(m[2]) + '/' + Number(m[3]), range: m[4] || '整天' };
    }

    function relativeTime(updatedAt) {
      const t = new Date(updatedAt).getTime();
      if (isNaN(t)) return '';
      const mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
      if (mins < 1) return '剛剛更新';
      if (mins < 60) return mins + ' 分鐘前更新';
      const hours = Math.floor(mins / 60);
      return hours < 24 ? hours + ' 小時前更新' : Math.floor(hours / 24) + ' 天前更新';
    }

    // 建立元素（一律用 textContent，使用者輸入的文字不會被當成 HTML）
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function showState(title, message) {
      app.className = 'card state';
      app.replaceChildren(el('h2', '', title), el('p', '', message));
    }

    async function api(path, options) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        ...options,
        headers: { ...HEADERS, 'Content-Type': 'application/json', ...(options && options.headers) },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    // ---------- 主程式 ----------

    async function main() {
      const id = new URLSearchParams(location.search).get('id') || '';
      if (!UUID_RE.test(id)) {
        showState('找不到這個應援', '連結可能不完整，請向分享的人再要一次。');
        return;
      }

      let pin;
      try {
        const rows = await api('pins?select=*&id=eq.' + id);
        pin = rows[0];
      } catch (e) {
        showState('讀取失敗', '請檢查網路後重新整理頁面。');
        return;
      }

      // RLS 讀不到 = 已結束 / 過期 / 被隱藏；沒有日期的 pin 跟 App 一樣，只顯示當天有更新的
      const today = taipeiDayNum(Date.now());
      const day = pin ? pinDayNum(pin.estimated_time) : null;
      const ended =
        !pin ||
        (day !== null && day < today) ||
        (day === null && taipeiDayNum(new Date(pin.updated_at).getTime()) < today);
      if (ended) {
        showState('這個應援已經結束了', '可能已發完、過期或被發布者下架。');
        return;
      }

      // 發布者暱稱（讀不到就用「追星人」）
      let publisher = '追星人';
      try {
        if (pin.user_id) {
          const names = await api('rpc/get_display_names', {
            method: 'POST',
            body: JSON.stringify({ user_ids: [pin.user_id] }),
          });
          if (names[0] && names[0].display_name) publisher = names[0].display_name;
        }
      } catch (e) { /* 暱稱失敗不影響顯示 */ }

      render(pin, publisher, day !== null && day > today);
    }

    function render(pin, publisher, isUpcoming) {
      const isGiveaway = pin.type === 'giveaway';
      const cats = pin.item_category || [];
      const qtys = pin.item_quantities || {};
      const qtyValues = Object.values(qtys);
      const total = !isGiveaway
        ? null
        : qtyValues.length > 0
          ? qtyValues.reduce((sum, q) => sum + toQty(q), 0)
          : (pin.quantity != null ? toQty(String(pin.quantity)) : null);

      document.title = (pin.group_label ? pin.group_label + ' ' : '') + TYPE_LABEL[pin.type] + '｜SpotM';
      app.className = 'card';
      app.replaceChildren();

      // 類型、預告、更新時間
      const top = el('div', 'top');
      top.append(el('span', 'badge', TYPE_LABEL[pin.type] || '應援'));
      if (isUpcoming) top.append(el('span', 'badge gray', '預告'));
      top.append(el('span', 'updated', relativeTime(pin.updated_at)));
      app.append(top);

      app.append(el('h1', 'group', pin.group_label || TYPE_LABEL[pin.type]));
      app.append(el('p', 'publisher', '發布者：' + publisher));

      if (pin.is_relocated) {
        app.append(el('div', 'notice', '⚠️ 地點已變更：' + (pin.relocation_notice || '請依最新位置前往')));
      }

      // 應援物 chips（發放類附數量）
      if (cats.length > 0) {
        const chips = el('div', 'chips');
        cats.forEach((cat) => {
          const chip = el('span', 'chip', cat);
          if (isGiveaway && qtys[cat] !== undefined) {
            const n = toQty(qtys[cat]);
            const q = el('span', 'qty', String(n));
            q.style.color = qtyColor(n);
            chip.append(q);
          }
          chips.append(chip);
        });
        app.append(chips);
      }

      // 剩餘 / 預計時間
      const grid = el('div', 'grid');
      const time = splitTime(pin.estimated_time);
      if (total !== null) {
        const cell = el('div', 'cell');
        cell.append(el('div', 'label', '剩餘'));
        const v = el('div', 'value', total > 0 ? total + ' 份' : '已發完');
        v.style.color = qtyColor(total);
        cell.append(v);
        grid.append(cell);
      }
      const timeCell = el('div', 'cell');
      timeCell.append(el('div', 'label', '預計時間' + (time.date ? '・' + time.date : '')));
      timeCell.append(el('div', 'value', time.range));
      if (total === null) timeCell.style.gridColumn = '1 / -1';
      grid.append(timeCell);
      app.append(grid);

      // 地點、領取條件
      if (pin.title) {
        const row = el('div', 'row');
        row.append(el('div', 'label', '📍 地點 / 穿著特徵'), el('div', 'value', pin.title));
        app.append(row);
      }
      const cond = el('div', 'row');
      cond.append(el('div', 'label', '🎫 領取條件'), el('div', 'value', pin.description || '無特殊說明'));
      app.append(cond);

      // 按鈕
      const btns = el('div', 'btns');
      const nav = el('a', 'btn primary', '🧭 Google 地圖導航');
      nav.href = 'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=' +
        pin.latitude + ',' + pin.longitude;
      nav.target = '_blank';
      nav.rel = 'noopener';
      const open = el('a', 'btn secondary', '用 SpotM App 開啟');
      open.href = 'spotm:///?focusId=' + encodeURIComponent(pin.id);
      btns.append(nav, open);
      app.append(btns);
      app.append(el('p', 'hint', '數量為即時資料，重新整理可看到最新數字'));
    }

    main();
  </script>
</body>
</html>
